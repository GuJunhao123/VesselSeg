version: '3.8'

services:
  vessel-seg:
    build:
      context: .
      dockerfile: Dockerfile
    image: vessel-seg:latest
    container_name: vessel-seg
    environment:
      PYTHONUNBUFFERED: "1"
      MODEL_DIR: /app/our_snap/model
      QT_QPA_PLATFORM: offscreen
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./our_snap/model:/app/our_snap/model
    command: ["python", "our_snap/main.py"]